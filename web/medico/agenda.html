<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGAC · Mi agenda</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/pantallas.css">
  <link rel="stylesheet" href="/css/visual.css">
  <script src="/js/tema.js"></script>
</head>
<body>

  <header class="encabezado">
    <span class="marca">
      <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-medical_services"/></svg>
      SIGAC
    </span>
    <div class="persona">
      <div class="selector-tema" role="group" aria-label="Modo de color">
        <button type="button" data-tema="claro" aria-pressed="false">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-light_mode"/></svg>Claro
        </button>
        <button type="button" data-tema="intermedio" aria-pressed="false">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-contrast"/></svg>Intermedio
        </button>
        <button type="button" data-tema="oscuro" aria-pressed="false">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-dark_mode"/></svg>Oscuro
        </button>
      </div>
      <div class="quien">
        <strong id="nombre-persona"></strong>
        <span id="detalle-persona" class="detalle"></span>
      </div>
      <button id="boton-salir" type="button" class="boton boton-secundario">
        <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-logout"/></svg>
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="contenido">

    <div class="barra-herramientas">
      <h1 class="titulo-icono">
        <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-stethoscope"/></svg>
        Mi agenda
      </h1>
      <div class="controles">
        <label for="fecha" class="texto-suave">Fecha</label>
        <input id="fecha" type="date">
        <button id="boton-hoy" type="button" class="boton">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-today"/></svg>
          Hoy
        </button>
      </div>
    </div>

    <div id="mensaje" class="mensaje oculto" role="status"></div>

    <div class="diseno-con-panel">

      <section class="tarjeta">
        <p id="resumen" class="texto-suave"></p>
        <table class="tabla">
          <thead>
            <tr>
              <th>Hora</th>
              <th>Paciente</th>
              <th>Consulta</th>
              <th>Estado</th>
              <th>Nota</th>
              <th><span class="solo-lector">Acción</span></th>
            </tr>
          </thead>
          <tbody id="filas-agenda"></tbody>
        </table>
        <div id="sin-citas" class="estado-vacio oculto">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-calendar_month"/></svg>
          No tienes citas en esta fecha. Elige otro día con el calendario.
        </div>
      </section>

      <aside id="panel" class="tarjeta panel-lateral oculto" aria-live="polite">
        <div class="panel-cabecera">
          <div>
            <h2 id="panel-paciente"></h2>
            <p id="panel-detalle" class="texto-suave"></p>
          </div>
          <button id="boton-cerrar-panel" type="button" class="boton boton-secundario boton-pequeno">
            <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-close"/></svg>
            Cerrar
          </button>
        </div>

        <p id="panel-motivo"></p>

        <div id="panel-mensaje" class="mensaje oculto" role="status"></div>

        <h3 class="titulo-icono">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-history"/></svg>
          Historial clínico
        </h3>
        <button id="boton-historial" type="button" class="boton boton-secundario boton-pequeno">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-visibility"/></svg>
          Ver historial
        </button>
        <div id="lista-historial" class="lista-historial"></div>

        <h3 class="titulo-icono">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-edit_note"/></svg>
          Nueva nota
        </h3>
        <form id="formulario-nota" novalidate>
          <div class="campo">
            <label for="diagnostico">Diagnóstico</label>
            <textarea id="diagnostico" rows="3" required></textarea>
          </div>
          <div class="campo">
            <label for="indicaciones">Indicaciones <span class="texto-suave">(opcional)</span></label>
            <textarea id="indicaciones" rows="3"></textarea>
          </div>
          <button type="submit" class="boton">
            <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-clinical_notes"/></svg>
            Guardar nota
          </button>
        </form>

        <h3 class="titulo-icono">
          <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-event_available"/></svg>
          Cerrar la cita
        </h3>
        <div class="grupo-botones">
          <button id="boton-atendida" type="button" class="boton">
            <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-check_circle"/></svg>
            Marcar atendida
          </button>
          <button id="boton-ausente" type="button" class="boton boton-aviso">
            <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#i-person_off"/></svg>
            Marcar ausente
          </button>
        </div>
      </aside>

    </div>
  </main>

  <script src="/js/sesion.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pagina.js"></script>
  <script src="/js/medico/agenda.js"></script>
</body>
</html>
