# SIGAC — Servidor de la aplicación web
# Sirve las páginas de web/ y reenvía /api/ a los webhooks de n8n
# por la red interna de Docker. El navegador solo habla con este
# servidor, así que no hay peticiones entre orígenes distintos (CORS).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # /api/consulta  →  http://n8n:5678/webhook/consulta
    location /api/ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Las páginas
    location / {
        try_files $uri $uri/ =404;
    }
}
