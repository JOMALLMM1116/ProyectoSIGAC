services:

  postgres:
    image: postgres:16-alpine
    container_name: sigac-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Guatemala
    volumes:
      - sigac_postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sigac-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: sigac-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      NODE_ENV: production
      GENERIC_TIMEZONE: America/Guatemala
      TZ: America/Guatemala
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SIGAC_CLAVE_CIFRADO: ${SIGAC_CLAVE_CIFRADO}
      SIGAC_CORREO_ADMIN: ${SIGAC_CORREO_ADMIN}
    volumes:
      - sigac_n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - mailhog

volumes:
  sigac_n8n_data:
  sigac_postgres_data:
